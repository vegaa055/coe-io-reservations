# Pinned so the Compose project name — and therefore the database volume —
# does not change if this folder is renamed or cloned elsewhere. Without it
# Compose derives the project from the directory, and a rename silently
# orphans the volume and hands you an empty database.
name: coe-io-reservations

services:
  db:
    image: postgres:17-alpine
    container_name: coe-io-reservations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: venue
      POSTGRES_DB: venue
    ports:
      - "5455:5432"
    volumes:
      - venue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venue-db-data:
